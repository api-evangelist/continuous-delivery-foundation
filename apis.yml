  - aid: continuous-delivery-foundation:ortelius
    name: Ortelius
    description: >-
      Ortelius is an open source supply chain evidence store that aggregates
      continuous security intelligence across the software delivery
      lifecycle. It exposes APIs for tracking microservice components, SBOMs,
      vulnerabilities, and deployment evidence so platform teams can answer
      where any component is running and what is in it.
    humanURL: https://ortelius.io/
