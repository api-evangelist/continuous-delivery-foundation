  - aid: continuous-delivery-foundation:cdevents
    name: CDEvents Specification
    description: >-
      CDEvents is a common specification for Continuous Delivery events that
      enables interoperability across CI/CD systems. It extends the
      CloudEvents specification and defines event vocabularies for source
      code control, continuous integration, testing, continuous deployment,
      continuous operations, and core lifecycle events. The specification is
      maintained at github.com/cdevents/spec.
    humanURL: https://cdevents.dev/
    tags:
      - CDEvents
      - CI/CD
      - CloudEvents
      - Event
      - Specification
    tags_raw:
