  - aid: continuous-delivery-foundation:content-api
    name: CD Foundation Content API
    description: >-
      The Continuous Delivery Foundation publishes a machine-readable index of its own website
      content. The foundation serves an RFC 9727 API catalog at /.well-known/api-catalog which
      anchors https://cd.foundation/wp-json/ as the service description; that endpoint returns a
      WordPress REST API index of 175 routes across 18 namespaces, including wp/v2 for posts,
      pages and members, and tribe/events/v1 for the CDF event calendar. It is read-oriented and
      requires no key for public content; write access uses WordPress application passwords.
    humanURL: https://cd.foundation/
    baseURL: https://cd.foundation/wp-json/
    tags:
      - Content
      - Events
      - Open-Source
      - REST
      - WordPress
    tags_raw:
      - Content
      - Events
      - Open Source
      - REST
      - WordPress
    properties:
