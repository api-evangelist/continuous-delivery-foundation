  - aid: continuous-delivery-foundation:screwdriver
    name: Screwdriver
    description: >-
      Screwdriver is an open-source build platform designed for Continuous
      Delivery, originally built at Yahoo. It provides a REST API for
      managing pipelines, builds, jobs, and webhooks and is designed to
      coordinate complex CD workflows across multiple repositories.
