aid: continuous-delivery-foundation
name: Continuous Delivery Foundation
description: >-
  The Continuous Delivery Foundation (CDF) is a Linux Foundation project that
  hosts vendor-neutral open source projects for continuous integration,
  continuous delivery, and DevOps. It is the home of CDEvents, Jenkins,
  Spinnaker, Screwdriver, Ortelius, JayeX, and was previously the home of
  Tekton (now a CNCF graduated project) and other CD-focused tooling.
