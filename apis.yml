    name: Spinnaker
    description: >-
      Spinnaker is an open-source, multi-cloud continuous delivery platform
      originally built at Netflix and Google for releasing software changes
      with high velocity and confidence. Spinnaker exposes a Gate REST API
      that drives pipelines, applications, and deployment workflows across
      AWS, GCP, Azure, Kubernetes, and other cloud targets.
