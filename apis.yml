- aid: continuous-delivery-foundation:tekton
  name: Tekton
  description: >-
    Tekton is a Kubernetes-native open source framework for creating CI/CD systems. It defines Custom
    Resource Definitions for Pipelines, Tasks, PipelineRuns, and TaskRuns and was originally hosted at
    the CDF before moving to the Cloud Native Computing Foundation (CNCF). It is included here for historical
    context with the CDF ecosystem.
  humanURL: https://tekton.dev/
  tags:
  - CI/CD
  - Kubernetes
  - Pipelines
  - Tekton
