domain_standards:
  - id: cdevents
    name: CDEvents
    conforms: true
    role: steward
    evidence: >-
      CDEvents IS the domain standard for this market — a common vocabulary for continuous
      delivery events — and the Continuous Delivery Foundation is the body that publishes it. The
      contract is machine-readable and was harvested: 49 JSON Schema 2020-12 event definitions
      under json-schema/cdevents/, spanning the core, source-code-control, continuous-integration,
      testing, continuous-deployment, continuous-operations and ticket vocabularies. Each schema
      carries an $id of the form https://cdevents.dev/0.6.0-draft/schema/<event>, which is the
      versioned identifier a consumer matches on.
    version: 0.6.0-draft
    url: https://cdevents.dev/
    schemas: json-schema/cdevents/
  - id: cloudevents
    name: CloudEvents
    conforms: true
    role: adopter
    evidence: >-
      CDEvents does not invent its own transport. cloudevents-binding.md pins CloudEvents
      specversion 1.0 and defines the mapping, so a consumer that already speaks CloudEvents
      integrates with no bespoke connector.
    url: https://cloudevents.io/
