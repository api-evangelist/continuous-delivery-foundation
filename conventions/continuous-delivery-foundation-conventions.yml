  errors: errors/continuous-delivery-foundation-problem-types.yml
  lifecycle: lifecycle/continuous-delivery-foundation-lifecycle.yml
  authentication: authentication/continuous-delivery-foundation-authentication.yml
  rate_limits: rate-limits/continuous-delivery-foundation-rate-limits.yml
  mcp: mcp/continuous-delivery-foundation-mcp.yml
