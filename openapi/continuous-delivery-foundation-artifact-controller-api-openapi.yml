openapi: 3.2.0
info:
  contact:
    name: ''
  description: ''
  title: Spinnaker Artifact Controller API
servers:
- description: Generated server url
  url: http://localhost
tags:
- name: artifact-controller
paths:
  /artifacts/account/{accountName}/names:
    get:
      operationId: artifactNames
      parameters:
      - in: path
        name: accountName
        required: true
        schema:
          type: string
      - in: query
        name: type
        required: true
        schema:
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Retrieve the list of artifact names that belong to chosen account
      tags:
      - artifact-controller
  /artifacts/account/{accountName}/versions:
    get:
      operationId: artifactVersions
      parameters:
      - in: path
        name: accountName
        required: true
        schema:
          type: string
      - in: query
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: artifactName
        required: true
        schema:
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Retrieve the list of artifact versions by account and artifact names
      tags:
      - artifact-controller
  /artifacts/content-address/{application}/{hash}:
    get:
      operationId: getStoredArtifact
      parameters:
      - in: path
        name: application
        required: true
        schema:
          type: string
      - in: path
        name: hash
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StoredView'
          description: OK
      summary: Retrieve artifact by content hash
      tags:
      - artifact-controller
  /artifacts/credentials:
    get:
      operationId: all_11
      parameters:
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  additionalProperties: {}
                  type: object
                type: array
          description: OK
      summary: Retrieve the list of artifact accounts configured in Clouddriver
      tags:
      - artifact-controller
  /artifacts/fetch:
    put:
      operationId: fetch
      parameters:
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: string
              type: object
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StreamingResponseBody'
          description: OK
      summary: Fetch the contents of an artifact
      tags:
      - artifact-controller
  /artifacts/{provider}/{packageName}:
    get:
      description: releaseStatus is an optional comma separated list of statuses to filter on.
      operationId: getVersionsOfArtifactForProvider
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      - in: path
        name: packageName
        required: true
        schema:
          type: string
      - in: query
        name: releaseStatus
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Retrieve the available artifact versions for an artifact provider and package…
      tags:
      - artifact-controller
  /artifacts/{provider}/{packageName}/{version}:
    get:
      operationId: getArtifact
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      - in: path
        name: packageName
        required: true
        schema:
          type: string
      - in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: Retrieve the specified artifact version for an artifact provider and package…
      tags:
      - artifact-controller
components:
  schemas:
    StreamingResponseBody: {}
    StoredView:
      properties:
        reference:
          type: string
      type: object
externalDocs:
  description: Spinnaker Documentation
  url: https://spinnaker.io
