openapi: 3.2.0
info:
  contact:
    name: ''
  description: ''
  title: Spinnaker Cloud Metric Controller API
servers:
- description: Generated server url
  url: http://localhost
tags:
- name: cloud-metric-controller
paths:
  /cloudMetrics/{cloudProvider}/{account}/{region}:
    get:
      operationId: findAll
      parameters:
      - in: path
        name: cloudProvider
        required: true
        schema:
          type: string
      - in: path
        name: account
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: query
        name: filters
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  additionalProperties: {}
                  type: object
                type: array
          description: OK
      tags:
      - cloud-metric-controller
      summary: Find all
      x-summary-source: derived
  /cloudMetrics/{cloudProvider}/{account}/{region}/{metricName}/statistics:
    get:
      operationId: getStatistics
      parameters:
      - in: path
        name: cloudProvider
        required: true
        schema:
          type: string
      - in: path
        name: account
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: path
        name: metricName
        required: true
        schema:
          type: string
      - in: query
        name: startTime
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: endTime
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: filters
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties: {}
                type: object
          description: OK
      tags:
      - cloud-metric-controller
      summary: Get statistics
      x-summary-source: derived
externalDocs:
  description: Spinnaker Documentation
  url: https://spinnaker.io
