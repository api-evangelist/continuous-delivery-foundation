openapi: 3.2.0
info:
  contact:
    name: ''
  description: ''
  title: Spinnaker Instance Controller API
servers:
- description: Generated server url
  url: http://localhost
tags:
- name: instance-controller
paths:
  /instances/{account}/{region}/{instanceId}:
    get:
      operationId: getInstanceDetails
      parameters:
      - in: path
        name: account
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: path
        name: instanceId
        required: true
        schema:
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: Retrieve an instance's details
      tags:
      - instance-controller
  /instances/{account}/{region}/{instanceId}/console:
    get:
      operationId: getConsoleOutput
      parameters:
      - in: path
        name: account
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: path
        name: instanceId
        required: true
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          default: aws
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: Retrieve an instance's console output
      tags:
      - instance-controller
externalDocs:
  description: Spinnaker Documentation
  url: https://spinnaker.io
