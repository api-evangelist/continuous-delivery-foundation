openapi: 3.2.0
info:
  contact:
    name: ''
  description: ''
  title: Spinnaker Load Balancer Controller API
servers:
- description: Generated server url
  url: http://localhost
tags:
- name: load-balancer-controller
paths:
  /applications/{application}/loadBalancers:
    get:
      operationId: getApplicationLoadBalancers
      parameters:
      - in: path
        name: application
        required: true
        schema:
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  additionalProperties: {}
                  type: object
                type: array
          description: OK
      summary: Retrieve a list of load balancers for a given application
      tags:
      - load-balancer-controller
  /loadBalancers:
    get:
      operationId: getAll
      parameters:
      - in: query
        name: provider
        required: false
        schema:
          default: aws
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items: {}
                type: array
          description: OK
      summary: Retrieve a list of load balancers for a given cloud provider
      tags:
      - load-balancer-controller
  /loadBalancers/{account}/{region}/{name}:
    get:
      operationId: getLoadBalancerDetails
      parameters:
      - in: path
        name: account
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          default: aws
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  additionalProperties: {}
                  type: object
                type: array
          description: OK
      summary: Retrieve a load balancer's details as a single element list for a given…
      tags:
      - load-balancer-controller
  /loadBalancers/{name}:
    get:
      operationId: getLoadBalancer
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          default: aws
          type: string
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: Retrieve a load balancer for a given cloud provider
      tags:
      - load-balancer-controller
externalDocs:
  description: Spinnaker Documentation
  url: https://spinnaker.io
