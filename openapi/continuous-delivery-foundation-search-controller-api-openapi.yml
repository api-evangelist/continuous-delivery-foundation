openapi: 3.2.0
info:
  contact:
    name: ''
  description: ''
  title: Spinnaker Search Controller API
servers:
- description: Generated server url
  url: http://localhost
tags:
- name: Search Controller
paths:
  /search:
    get:
      operationId: search
      parameters:
      - in: query
        name: q
        required: false
        schema:
          default: ''
          type: string
      - in: query
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: platform
        required: false
        schema:
          type: string
      - in: query
        name: pageSize
        required: false
        schema:
          default: 10000
          format: int32
          type: integer
      - in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
      - in: query
        name: allowShortQuery
        required: false
        schema:
          default: false
          type: boolean
      - in: header
        name: X-RateLimit-App
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  additionalProperties: {}
                  type: object
                type: array
          description: OK
      summary: Search infrastructure
      tags:
      - Search Controller
externalDocs:
  description: Spinnaker Documentation
  url: https://spinnaker.io
