openapi: 3.2.0
info:
  contact:
    name: ''
  description: ''
  title: Spinnaker Snapshot Controller API
servers:
- description: Generated server url
  url: http://localhost
tags:
- name: snapshot-controller
paths:
  /applications/{application}/snapshots/{account}:
    get:
      operationId: getCurrentSnapshot
      parameters:
      - in: path
        name: application
        required: true
        schema:
          type: string
      - in: path
        name: account
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: Get current snapshot
      tags:
      - snapshot-controller
  /applications/{application}/snapshots/{account}/history:
    get:
      operationId: getSnapshotHistory
      parameters:
      - in: path
        name: application
        required: true
        schema:
          type: string
      - in: path
        name: account
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  additionalProperties: {}
                  type: object
                type: array
          description: OK
      summary: Get snapshot history
      tags:
      - snapshot-controller
externalDocs:
  description: Spinnaker Documentation
  url: https://spinnaker.io
