          description: Successful
          content:
            application/json:
              schema:
                type: string
    delete:
      summary: Delete a single build cluster
      operationId: deleteV4BuildclustersName
      description: Returns null if successful
      parameters:
      - name: name
        in: path
        schema:
          type: string
          description: Name of the build cluster
          example: iOS
          maxLength: 50
          pattern: ^[\w.-]+$
        description: Name of the build cluster
        required: true
      tags:
      - v4
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/builds/statuses:
    get:
      summary: Get build statuses for jobs
      operationId: getV4BuildsStatuses
      description: Returns id, jobId, and status for builds
      parameters:
      - name: jobIds
        in: query
        schema:
          example: 123345
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^[0-9]+$
            name: jobIds
          - type: string
            pattern: ^[0-9]+$
        required: true
      - name: numBuilds
        in: query
        schema:
          type: integer
          default: 1
          x-constraint:
            sign: positive
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model8'
