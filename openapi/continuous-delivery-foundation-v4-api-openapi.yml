components:
  schemas:
    Model23:
      type: object
      default: {}
      properties:
        displayJobNameLength:
          type: integer
          description: Job name length to display on workflowGraph
          example: 20
          default: 20
          minimum: 20
          maximum: 99
        timestampFormat:
          $ref: '#/components/schemas/timestampFormat'
        allowNotification:
          type: boolean
          description: Allow Browser Notification
          default: false
    TemplateTag:
      type: object
      properties:
        id:
          type: integer
          description: Identifier of this template tag
          example: 123345
          x-constraint:
            sign: positive
        createTime:
          type: string
          description: When this template tag was created
          example: '2038-01-19T03:14:08.131Z'
          maxLength: 32
          x-format:
            isoDate: true
        namespace:
          type: string
          description: Namespace of the Template
          example: node
          maxLength: 64
          pattern: ^[\w-]+$
        name:
          type: string
          description: Template name
          example: nodejs/lib
          maxLength: 64
        tag:
          type: string
          description: Name of the Template Tag
          example: latest
          maxLength: 30
          pattern: ^[a-zA-Z][\w-.]+$
        version:
          type: string
          description: Exact version of the Template
          example: 1.2.3
          maxLength: 16
          pattern: ^(\d+)\.(\d+)\.(\d+)$
        templateType:
          $ref: '#/components/schemas/templateType'
      required:
      - templateType
    Model74:
      type: object
      properties:
        version:
          anyOf:
          - type: string
            description: Exact version of the Command
            example: 1.2.3
            maxLength: 16
            pattern: ^(\d+)\.(\d+)\.(\d+)$
          - type: string
            description: Name of the Command Tag
            example: latest
            maxLength: 30
            pattern: ^[a-zA-Z][\w-.]+$
    Model26:
      type: array
      items:
        $ref: '#/components/schemas/Model24'
    Model73:
      type: object
      properties:
        version:
          type: string
          description: Exact version of the Template
          example: 1.2.3
          maxLength: 16
          pattern: ^(\d+)\.(\d+)\.(\d+)$
    Model50:
      type: array
      items:
        $ref: '#/components/schemas/TemplateTag'
    Model62:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
      required:
      - name
      - content
    Model77:
      type: object
      properties:
        version:
          type: string
          description: Exact version of the Template
          example: 1.2.3
          maxLength: 16
          pattern: ^(\d+)\.(\d+)\.(\d+)$
    SCM_Repository:
      type: object
      properties:
        name:
          type: string
          example: screwdriver-cd/screwdriver
        branch:
          type: string
          example: master
        url:
          type: string
          example: https://github.com/screwdriver-cd/screwdriver/tree/master
          x-format:
            uri: true
        private:
          type: boolean
        rootDir:
          type: string
          description: Root directory (relative to checkoutUrl)
          example: src/app/component
          maxLength: 100
      required:
      - name
      - branch
      - url
    timestampFormat:
      type: string
      description: User preferred timestamp
      default: LOCAL_TIMEZONE
      enum:
      - UTC
      - LOCAL_TIMEZONE
    Model8:
      type: array
      items:
        type: string
    usernames:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: string
        description: Username
        example: batman123
        maxLength: 128
    admins:
      type: object
      description: Admins of this Pipeline
      example:
        myself: true
    meta:
      type: object
      description: Key=>Value information from the build itself
      default: {}
    Model24:
      type: object
    Model51:
      type: object
      properties:
        id:
          type: integer
          description: Identifier of this pipeline
          example: 123345
          x-constraint:
            sign: positive
        name:
          type: string
          example: screwdriver-cd/screwdriver
        scmRepo:
          $ref: '#/components/schemas/SCM_Repository'
        lastRun:
          anyOf:
          - type: string
            description: When this event was created
            example: '2038-01-19T03:14:08.131Z'
            maxLength: 32
            x-format:
              isoDate: true
          - type:
            - string
            - 'null'
        admins:
          $ref: '#/components/schemas/admins'
      required:
      - id
      - name
      - scmRepo
      - admins
    List_of_secrets:
      type: array
      items:
        $ref: '#/components/schemas/Get%20Secret'
    Model75:
