openapi: 3.2.0
info:
  title: Screwdriver API Documentation V4 API
  version: '3'
servers:
- url: https://api.screwdriver.cd/
security:
- jwt: []
tags:
- name: v4
paths:
  /v4/banners:
    get:
      summary: Get banners
      operationId: getV4Banners
      description: Returns all banner records
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List%20Banners'
    post:
      summary: Create a new banner
      operationId: postV4Banners
      description: Create a specific banner
      tags:
      - v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create%20Banner'
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/buildclusters:
    get:
      summary: Get build clusters
      operationId: getV4Buildclusters
      description: Returns all build clusters
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List%20of%20build%20clusters'
    post:
      summary: Create a build cluster
      operationId: postV4Buildclusters
      description: Create a specific build cluster
      tags:
      - v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create%20Build'
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/collections:
    get:
      summary: Get collections for requesting user
      operationId: getV4Collections
      description: Returns all collection records belonging to the requesting user
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List%20collections%20for%20requesting%20user'
    post:
      summary: Create a new collection
      operationId: postV4Collections
      description: Creates a collection
      tags:
      - v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create%20collection'
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/commands:
    get:
      summary: Get commands with pagination
      operationId: getV4Commands
      description: Returns all command records
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          description: Page to paginate
          minimum: 1
        description: Page to paginate
      - name: count
        in: query
        schema:
          type: integer
          description: Count to paginate
          minimum: 1
          maximum: 50
        description: Count to paginate
      - name: search
        in: query
        schema:
          type: string
          description: Keyword to search by
          maxLength: 200
        description: Keyword to search by
      - name: sort
        in: query
        schema:
          type: string
          description: Sorting option
          default: descending
          enum:
          - ascending
          - descending
          x-convert:
            case: lower
        description: Sorting option
      - name: sortBy
        in: query
        schema:
          type: string
          description: Field to sort by
          maxLength: 100
        description: Field to sort by
      - name: getCount
        in: query
        schema:
          type: boolean
          description: Return total count
        description: Return total count
      - name: namespace
        in: query
        schema:
          type: string
          description: Namespace of the Command
          example: chefdk
          maxLength: 64
          pattern: ^[\w-]+$
        description: Namespace of the Command
      - name: distinct
        in: query
        schema:
          type: string
          enum:
          - id
          - namespace
          - version
          - description
          - maintainer
          - format
          - habitat
          - docker
          - binary
          - name
          - pipelineId
          - createTime
          - usage
          - trusted
          - latest
          - compatibilities
      - name: compact
        in: query
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/x-alt-definitions/List%20of%20commands'
                - $ref: '#/x-alt-definitions/Model2'
                - $ref: '#/x-alt-definitions/Command%20Count%20and%20List%20of%20commands'
    post:
      summary: Create a new command
      operationId: postV4Commands
      description: Create a specific command
      tags:
      - v4
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/isAdmin:
    get:
      summary: Check if a user is admin of a pipeline, event, or job
      operationId: getV4Isadmin
      description: Returns true or false
      parameters:
      - name: pipelineId
        in: query
        schema:
          type: integer
          description: Identifier of this pipeline
          example: 123345
          x-constraint:
            sign: positive
        description: Identifier of this pipeline
      - name: eventId
        in: query
        schema:
          type: integer
          description: Identifier of this event
          example: 123345
          x-constraint:
            sign: positive
        description: Identifier of this event
      - name: jobId
        in: query
        schema:
          type: integer
          description: Identifier of this Job
          example: 123345
          x-constraint:
            sign: positive
        description: Identifier of this Job
      tags:
      - v4
      security:
      - token: []
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/metrics:
    get:
      summary: application metrics
      operationId: getV4Metrics
      description: Expose application metrics
      tags:
      - v4
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/pipelines:
    get:
      summary: Get pipelines with pagination
      operationId: getV4Pipelines
      description: Returns all pipeline records
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          description: Page to paginate
          minimum: 1
        description: Page to paginate
      - name: count
        in: query
        schema:
          type: integer
          description: Count to paginate
          minimum: 1
          maximum: 50
        description: Count to paginate
      - name: search
        in: query
        schema:
          type: string
          description: Keyword to search by
          maxLength: 200
        description: Keyword to search by
      - name: sort
        in: query
        schema:
          type: string
          description: Sorting option
          default: descending
          enum:
          - ascending
          - descending
          x-convert:
            case: lower
        description: Sorting option
      - name: sortBy
        in: query
        schema:
          type: string
          description: Field to sort by
          maxLength: 100
        description: Field to sort by
      - name: getCount
        in: query
        schema:
          type: boolean
          description: Return total count
        description: Return total count
      - name: configPipelineId
        in: query
        schema:
          type: integer
          description: Identifier of this pipeline
          example: 123345
          x-constraint:
            sign: positive
        description: Identifier of this pipeline
      - name: ids[]
        in: query
        schema:
          anyOf:
          - type: array
            items:
              type: integer
              description: Identifier of this pipeline
              example: 123345
              x-constraint:
                sign: positive
            name: ids[]
          - type: integer
            description: Identifier of this pipeline
            example: 123345
            x-constraint:
              sign: positive
      - name: scmUri
        in: query
        schema:
          type: string
          description: Unique identifier for the application
          example: github.com:123456:master
          maxLength: 500
          pattern: ^([^:]+):([^:]+):([^:]+)(?::(.*))?$
        description: Unique identifier for the application
      - name: scmContext
        in: query
        schema:
          type: string
          description: The SCM in which the repository exists
          example: github:github.com
          maxLength: 128
          pattern: ^([^:]+):([^:]+)$
        description: The SCM in which the repository exists
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List%20of%20Pipelines'
    post:
      summary: Create a new pipeline
      operationId: postV4Pipelines
      description: Create a specific pipeline
      tags:
      - v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create%20Pipeline'
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/release:
    get:
      summary: API Release information
      operationId: getV4Release
      description: Should respond with 200
      tags:
      - v4
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/stats:
    get:
      summary: API stats
      operationId: getV4Stats
      description: Should return statistics for the entire system
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats%20Object'
  /v4/status:
    get:
      summary: API status
      operationId: getV4Status
      description: 'Should respond with 200: ok'
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/x-alt-definitions/Model4'
                - $ref: '#/x-alt-definitions/Model5'
  /v4/templates:
    get:
      summary: Get templates with pagination
      operationId: getV4Templates
      description: Returns all template records
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          description: Page to paginate
          minimum: 1
        description: Page to paginate
      - name: count
        in: query
        schema:
          type: integer
          description: Count to paginate
          minimum: 1
          maximum: 50
        description: Count to paginate
      - name: search
        in: query
        schema:
          type: string
          description: Keyword to search by
          maxLength: 200
        description: Keyword to search by
      - name: sort
        in: query
        schema:
          type: string
          description: Sorting option
          default: descending
          enum:
          - ascending
          - descending
          x-convert:
            case: lower
        description: Sorting option
      - name: sortBy
        in: query
        schema:
          type: string
          description: Field to sort by
          maxLength: 100
        description: Field to sort by
      - name: getCount
        in: query
        schema:
          type: boolean
          description: Return total count
        description: Return total count
      - name: namespace
        in: query
        schema:
          type: string
          description: Namespace of the Template
          example: node
          maxLength: 64
          pattern: ^[\w-]+$
        description: Namespace of the Template
      - name: distinct
        in: query
        schema:
          type: string
          enum:
          - id
          - labels
          - config
          - name
          - version
          - description
          - maintainer
          - pipelineId
          - namespace
          - images
          - createTime
          - trusted
          - latest
          - compatibilities
      - name: compact
        in: query
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/x-alt-definitions/List%20of%20templates'
                - $ref: '#/x-alt-definitions/Model8'
                - $ref: '#/x-alt-definitions/Template%20Count%20and%20List%20of%20templates'
    post:
      summary: Create a new template
      operationId: postV4Templates
      description: Create a specific template
      tags:
      - v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Certify%20input%20to%20template%20validator'
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/tokens:
    get:
      summary: Get tokens with pagination
      operationId: getV4Tokens
      description: Returns all token records belonging to the current user
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model7'
    post:
      summary: Create a new token
      operationId: postV4Tokens
      description: Create a specific token
      tags:
      - v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create%20token'
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/versions:
    get:
      summary: API Package Versions
      operationId: getV4Versions
      description: Returns list of Screwdriver package versions and third-party dependencies
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Versions%20Object'
  /v4/auth/contexts:
    get:
      summary: Get all auth contexts
      operationId: getV4AuthContexts
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Array%20of%20Contexts'
  /v4/auth/crumb:
    get:
      summary: Generate crumb
      operationId: getV4AuthCrumb
      description: Should return a crumb
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crumb%20to%20prevent%20CSRF%20Object'
  /v4/auth/key:
    get:
      summary: Get jwt public key
      operationId: getV4AuthKey
      description: Public Key for verifying JSON Web Tokens
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public%20Key%20for%20Verifying%20JWTs%20Object'
  /v4/banners/{id}:
    get:
      summary: Get a single banner
      operationId: getV4BannersId
      description: Return a banner record
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          x-constraint:
            sign: positive
        required: true
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get%20Banner'
    put:
      summary: Update a banner
      operationId: putV4BannersId
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          x-constraint:
            sign: positive
        required: true
      tags:
      - v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update%20Banner'
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
    delete:
      summary: Delete a banner
      operationId: deleteV4BannersId
      description: Delete a specific banner and return null if success
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          x-constraint:
            sign: positive
        required: true
      tags:
      - v4
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v4/buildclusters/{name}:
    get:
      summary: Get a single build cluster
      operationId: getV4BuildclustersName
      description: Returns a build cluster record
      parameters:
      - name: name
        in: path
        schema:
          type: string
          description: Name of the build cluster
          example: iOS
          maxLength: 50
          pattern: ^[\w.-]+$
        description: Name of the build cluster
        required: true
      tags:
      - v4
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get%20BuildCluster'
    put:
      summary: Update a build cluster
      operationId: putV4BuildclustersName
      parameters:
      - name: name
        in: path
        schema:
          type: string
          description: Name of the build cluster
          example: iOS
          maxLength: 50
