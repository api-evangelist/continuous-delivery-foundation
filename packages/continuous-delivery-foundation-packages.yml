note: >-
  The Continuous Delivery Foundation itself ships no client library. Its hosted projects do, and
  every entry below is first-party — published from the project's own GitHub organization to the
  registry named. Versions and dates were read from each registry's metadata endpoint on
  2026-09-05, not from prose. The CDEvents SDK family is the clearest currency signal in this
  record: the Go and Rust SDKs track the 0.6.0-draft specification, the Java SDK last shipped
  0.3.1 in March 2024, the Python SDK has never been published to PyPI at all, and the .NET SDK
  repository is empty.
