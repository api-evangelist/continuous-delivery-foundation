description: >-
  Plans and pricing for the Continuous Delivery Foundation API surface. There are none, and there
  is no pricing page to read. REPLACES a scaffold written by the 2026-05-04 bulk sweep which
  asserted a Free / Professional / Enterprise ladder with 1,000 and 100,000 request quotas, TBD
  prices, SLA targets and a dedicated account manager. None of that exists.
plan_count: 0
plans: []
pricing_url: null
commercial_model: >-
  The CDF is a Linux Foundation project. Every API in this record belongs to an open source project
  the consumer self-hosts under an OSI-approved licence — there is no metered service, no API key
  to buy, and no quota anyone could exceed. What the foundation does sell is MEMBERSHIP
  (https://cd.foundation/members/), which buys governance participation, not API access, and is
  therefore not a plan for this API surface.
